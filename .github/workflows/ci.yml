# CI: configure, build and test Carthage on every push to main, on macOS (Apple Silicon) and
# Windows x64, with the same presets a developer uses (AGENTS.md, "Commands"). Needs no secrets.
# The tests are headless: no audio hardware, no third-party plugins (docs/TESTING.md).
# ccache keeps compiled objects between runs (JUCE and Tracktion barely change); the cache is the
# same build, reused, so a run with a cold cache and one with a warm cache test the same code.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "design/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-26 }
          - { name: Windows x64, os: windows-2025-vs2026 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      # Not recursive: Tracktion Engine's own nested JUCE is not used (DECISIONS W7).
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja ccache
          cmake --version
          clang++ --version

      - name: Tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache --no-progress -y
          .github/scripts/msvc-env.ps1

      - name: Configure
        run: |
          cmake --version
          cmake --preset release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build --preset release
          ccache --show-stats

      - name: Test
        run: ctest --preset release

  # Static checks and sanitizers (DECISIONS W39, docs/TESTING.md "Static checks and sanitizers"),
  # macOS only: Homebrew LLVM provides clang-tidy and RTSan; Apple Clang provides ASan and UBSan.
  checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: clang-tidy, preset: release, kind: tidy }
          - { name: ASan and UBSan tests, preset: asan, kind: test }
          - { name: RTSan tests, preset: rtsan, kind: test }
          - { name: Fuzzing, preset: fuzz, kind: fuzz }
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-checks-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-checks-${{ matrix.preset }}-

      - name: Tools
        run: |
          brew install ninja ccache llvm
          /opt/homebrew/opt/llvm/bin/clang-tidy --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

      # Builds first, so generated headers exist and the analysis sees what the compiler sees.
      - name: Build
        if: matrix.kind != 'fuzz'
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Build fuzz targets
        if: matrix.kind == 'fuzz'
        run: cmake --build --preset fuzz --target carthage_fuzz_project carthage_fuzz_audio

      # A minute each from the seeds; a crash fails the job and the input is uploaded below.
      - name: Fuzz
        if: matrix.kind == 'fuzz'
        run: |
          for t in project audio; do
            exe=$(find build/fuzz/tools/fuzz -type f -name "carthage_fuzz_$t" -perm -u+x | head -1)
            mkdir -p "fuzz-corpus/$t" fuzz-crashes
            "$exe" -max_total_time=60 -timeout=10 -rss_limit_mb=4096 -artifact_prefix=fuzz-crashes/ "fuzz-corpus/$t" "tools/fuzz/seeds/$t"
          done

      - name: Keep a crashing input
        if: failure() && matrix.kind == 'fuzz'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: fuzz-crashes

      - name: clang-tidy
        if: matrix.kind == 'tidy'
        run: |
          /opt/homebrew/opt/llvm/bin/run-clang-tidy -clang-tidy-binary /opt/homebrew/opt/llvm/bin/clang-tidy \
            -p build/release -quiet "$PWD/(src|tools|tests)/.*\.cpp$"

      - name: Test
        if: matrix.kind == 'test'
        run: ctest --preset ${{ matrix.preset }}
